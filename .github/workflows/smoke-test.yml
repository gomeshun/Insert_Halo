name: Smoke test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  import-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Import Insert_Halo
        run: python -c "from IH_main import Insert_Halo; print('Insert_Halo import OK')"
